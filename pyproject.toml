[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wakamat"
version = "0.1.0"
description = "Agent Teams - Multi-agent orchestration framework inspired by Claude Code Agent Teams"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "filelock>=3.12.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
wakamat = "wakamat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wakamat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
